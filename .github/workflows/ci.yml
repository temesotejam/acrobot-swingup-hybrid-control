name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q

  hybrid-benchmark:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Optimize library and run endpoint, holdout and noisy robustness sweeps
        run: python -m acrobot_hybrid.run --output-dir results
      - name: Verify adaptive closed-loop control result
        run: |
          test -f results/summary.json
          test -f results/summary.md
          test -f results/nominal_trajectory.npz
          test -f results/tvlqr_gains.npy
          test -f results/trajectory.csv
          test -f results/robustness.csv
          test -f results/robustness.json
          test -f results/holdout.csv
          test -f results/holdout.json
          test -f results/adaptive-library.json
          test -f results/videos/hybrid.mp4
          test -f results/plots/states.png
          test -f results/plots/height.png
          test -f results/plots/torque.png
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('results/summary.json').read_text())
          m = s['metrics']
          assert s['success'] is True
          assert s['robustness_gate'] is True
          assert s['adaptive_model_mismatch_gate'] is True
          assert s['holdout_noise_gate'] is True
          assert m['capture'] is True
          assert m['final_stable'] is True
          assert m['final_2s_stable_ratio'] >= 0.80
          assert m['final_tip_height_m'] > 1.99
          assert abs(float(s['physical_torque_limit_nm']) - 1.0) < 1e-12
          assert len(s['adaptive_library']) == 9
          assert s['adaptive_identification_correct'] >= 7
          assert s['adaptive_identification_total'] == 8
          initial = s['robustness_summary']['initial-state']
          assert initial['tvlqr']['final_stable_count'] == 8
          model = s['robustness_summary']['model-mismatch']
          assert model['adaptive']['capture_count'] >= 7
          assert model['adaptive']['final_stable_count'] >= 6
          clean = s['holdout_summary']['clean-holdout']
          noisy = s['holdout_summary']['noisy-holdout']
          assert clean['count'] == 8
          assert clean['capture_count'] >= 7
          assert clean['final_stable_count'] >= 6
          assert noisy['count'] == 24
          assert noisy['capture_count'] >= 20
          assert noisy['final_stable_count'] >= 18
          noise = s['sensor_noise']
          assert abs(float(noise['angle_white_std_deg']) - 0.25) < 1e-12
          assert abs(float(noise['angle_bias_std_deg']) - 1.0) < 1e-12
          assert abs(float(noise['gyro_white_std_dps']) - 0.10) < 1e-12
          assert abs(float(noise['gyro_bias_std_dps']) - 0.30) < 1e-12
          PY
      - name: Build Pages preview
        run: |
          python web/build_pages.py --results results --output site --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test -f site/index.html
          test -f site/videos/hybrid.mp4
          grep -q 'Adaptive replanning' site/index.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hybrid-control-${{ github.run_number }}
          path: results/
          retention-days: 30
